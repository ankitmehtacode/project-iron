# ─────────────────────────────────────────────
# Project Iron — Pre-commit Hooks
# Setup: pre-commit install
# Run manually: pre-commit run --all-files
# ─────────────────────────────────────────────

repos:
  # Black: auto-formats Python code
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.10
        # Configured by [tool.black] in pyproject.toml, so this hook and the
        # CI lint job cannot disagree about line length.

  # Flake8: lints Python code for errors/style
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        # Configured by .flake8, shared with the CI lint job.

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=50000"]
