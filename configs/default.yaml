# project-iron default configuration
#
# Every value here is also a field default in src/config.py, so deleting this
# file changes nothing. It exists to make the tunable surface visible in one
# place and to give operators a file to edit instead of source code.
#
# Precedence: IRON_* environment variables > this file > field defaults.
# Nested sections use a double underscore, e.g. IRON_RUNTIME__SEED=7.
#
# Relative paths resolve against the repository root, which is derived from
# src/config.py's location on disk — never from the current working directory.

paths:
  models_dir: models
  cache_dir: .cache
  output_dir: outputs
  log_dir: logs
  # Relative to models_dir.
  vjepa_xml: int8/vjepa2_vitl_int8.xml
  cotracker_checkpoint: weights/cotracker3/scaled_offline.pth

runtime:
  device: CPU
  # 0 means "leave the runtime's own default alone", which is what the code did
  # before configuration existed. Pinning these changes throughput.
  ov_num_threads: 0
  torch_num_threads: 0
  seed: 0

pipeline:
  # These mirror the values previously hardcoded in endurance_run.py and
  # semantic_extractor.py. They are preserved exactly: the published V-JEPA2
  # checkpoint this repo fetches is 256px / 64-frame, so 224/4 is suspect, but
  # correcting it changes numerical output and needs a measured, gated change.
  grid_size: 10
  clip_frames: 4
  clip_channels: 3
  clip_h: 224
  clip_w: 224
  # V-JEPA2 consumes 2 frames per temporal token: 4 frames -> 2 temporal slots.
  tubelet: 2
  patch_size: 16

cascade:
  # The motion gate runs at this resolution regardless of source size. Gating
  # asks "did anything move", not "what is it", so it does not need detector
  # resolution. At 720p this is ~12x cheaper and, on every bench scenario,
  # reaches identical wake decisions. Set either to 0 to gate at full size.
  gate_width: 320
  gate_height: 180
  min_foreground_fraction: 0.002
  stay_awake_frames: 12
  diff_threshold: 25
  warmup_frames: 10
  stats_interval_s: 10.0
  # PRODUCT BUDGET: what Tier-1 needs. Currently MISSED (worst measured
  # 4.51%). Never adjust this to match what the code does.
  idle_core_budget_fraction: 0.03
  # CI REGRESSION CEILING: set from the worst pinned-stack measurement plus
  # headroom. Catches regressions only; it is NOT a claim the budget is met.
  regression_ceiling_fraction: 0.055
  measured_stack: "opencv 4.8.1.78 / numpy 1.26.2 / python 3.10.20"

eval:
  # Which golden set backs a reported number. v1 is driving-domain and legacy;
  # the product is indoor, so v2 is the only set a product metric may cite.
  golden_set_version: v2-indoor
  golden_sets_dir: configs/golden
  allow_legacy_golden_set: false

endurance:
  num_clips: 200
  # The first inference allocates framework buffers; including it would fit a
  # step change as though it were a trend.
  warmup_clips: 1
  # A leak is a rate, so the gate is a rate. Growth is fitted as a regression
  # slope and converted to MB/hour using the run's measured throughput, then
  # compared against the upper bound of its 95% confidence interval.
  leak_mb_per_hour_max: 50.0
  reinit_cycles: 20
  tracemalloc_top: 10
  tracemalloc_interval_clips: 25
  log_filename: endurance_run.log
  metrics_filename: endurance_metrics.jsonl
