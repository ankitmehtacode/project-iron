    and shared workspaces." Semi-automatic labeling: YOLOv8x detection + Deep SORT
    tracklets, then manual cross-camera identity verification via a custom GUI. DISCREPANCY
    FROM THE DAY-36 PROMPT: the prompt text describes "four connected indoor environments"
    as a fact to record; the README at the commit actually read does not state an
    environment count anywhere — that clause is not verified and is deliberately NOT
    repeated as fact here. consent_posture was recorded "unknown" at the time (Day
    36) because the README documents no consent or notice process (contrast MEVA''s
    hired-actor posture, which IS documented) — superseded below.


    Day 38 update (a human read the HuggingFace card, the paper via PMC, and the GitHub
    README directly — none of the three hosts is reachable from this environment,
    so this paragraph encodes what was found rather than re-deriving it). Three distinct
    legal questions, three different answers:

    (1) COPYRIGHT/REDISTRIBUTION — clean, CC-BY-4.0, confirmed identically across
    all three sources (see hypothesis_class above).

    (2) DATA-SUBJECT CONSENT — unusually strong; consent_posture upgraded from "unknown"
    to "staged_actors" on the strength of the paper''s Methods section, quoted verbatim
    rather than paraphrased: "This study was conducted under the supervision of the
    Ethical Committee of the University of Alicante (Approval No. UA-2022-11-12).
    All participants were informed about the study, including data handling procedures,
    and provided their consent for participation and unrestricted data use. Specifically,
    participants granted permission for their inclusion in dataset video recordings,
    which capture physical data (face and body features), and consented to making
    these recordings publicly available with unrestricted use." This is the cleanest
    consent statement in this registry''s history across all 63 entries.

    (3) DEPLOYMENT-SCOPE RESTRICTION — newly discovered, unresolved, and NEITHER of
    the above: see the deployment_scope_restriction field. The HuggingFace card''s
    "Out-of-Scope Use" clause is absent from the GitHub README and the paper — it
    does not read as boilerplate, and resolving which of its two plausible readings
    governs (narrow: permits use if the DEPLOYED system has its own valid consent
    architecture; broad: excludes any surveillance/identification/ monitoring product
    regardless of deployment consent) is a legal interpretation. No one — not this
    entry, not Claude Code, not the chat assistant that first found it — is authorized
    to resolve which reading governs. See docs/blocker_ledger.yaml''s chirla_deployment_scope_legal_review
    entry.

    PROCEDURAL NOTE, separate from all three legal questions above: CHIRLA is gated
    on HuggingFace — downloading requires an account login and click-through acceptance
    of the dataset''s conditions before any file access. That gate is orthogonal to
    license verification and is one more reason this cannot be resolved by Claude
    Code alone (no HuggingFace account, and no network access to huggingface.co either).


    Did NOT, in this update: flip license_snapshot from null, change CHIRLA''s lane
    from R, or write a resolution for deployment_scope_restriction — see src.data.registry.DatasetRegistry.require_product_claim_clearance
    for the one place resolved is read, and FOUNDATION_REPORT.md''s Day-38 section
    for why self-certifying any of the three would have been the finding to report,
    not an action to take.'
