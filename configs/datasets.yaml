- name: Infinigen-Indoors-depth-candidate
  lane: S
  subsystem: depth
  hypothesis_class: BSD-3 generator, procedurally generated assets, ours outright
    once generated — same standing as synthetic-indoor-v3.
  notes: 'CANDIDATE ONLY, AND NOT TRUSTED FOR DEPTH. Procedural materials and real
    shading may restore the cues analytic primitives delete, or may not. ACCEPTANCE
    PROCEDURE, binding: generate a set, run it through the Objective-2 depth validity
    gate (rank correlation >= 0.30, dynamic range >= 3.0, no distance band above 90%
    of pixels), and only then may a depth number be computed on it. The same test
    condemned v3-indoor. Being synthetic-but-photorealistic is a hypothesis, not a
    pass. HUMAN ACTION: none — this one is unblocked by work, not by paperwork. DAY
    11: default indoors pipeline does NOT generate humans — the human assets live
    in a separate Infinigen branch and are not commercially cleared. This entry is
    therefore silent on human-appearance capabilities. DAY 11 GENERATION VERDICT:
    no scoreable sample was produced on this box. Two paths were attempted from a
    clean .venv-infinigen (Python 3.11.15, bpy==4.2.0, infinigen==1.12.2 — Infinigen
    requires ==3.11.*, so the pinned 3.10 measurement env stayed untouched; scikit-image
    was constrained to 0.21.0 because Infinigen''s pinned 0.19.3 cannot build on macOS
    15 clang). Furnished path (`fast_solve.gin`) ran 623 constraint-annealing iterations
    over 21m35s, completed 7 of many solver stages across 5 rooms, and was killed
    with 0 frames rendered — each annealing iteration takes 25-55s and per-stage budgets
    are 100 iterations. Empty-room path (`singleroom.gin + fast_solve.gin + no_objects.gin`)
    exits in ~30s on an `AssertionError: (0.024, 0.018, 1280, 720)` inside `get_sensor_coords`
    — the default sensor is 4:3 and the default render resolution is 16:9, and the
    `--overrides execute_tasks.generate_resolution=[160,120]` needed to reconcile
    them is silently not applied by gin. Full logs preserved at docs/day11/infinigen_render_stall.log
    (furnished path) and docs/day11/infinigen_empty_room_stderr.log (empty-room assertion).
    Strategic consequence: no renderer available to us can score appearance-learned
    capabilities in a decision-quality session budget on this hardware, which makes
    real data the sole path for depth, semantics and re-ID. This is a finding about
    *our compute*, not about Infinigen''s quality: on a GPU box with hours of budget,
    the acceptance procedure remains the right test. DAY 12 CORRECTION: the Day-11
    verdict above overclaimed. What Day 11 established is that generation did not
    COMPLETE within a session budget on this hardware — it never established that
    Infinigen CANNOT generate a passing sample. Those are different claims and the
    first does not imply the second. The depth validity gate on this candidate remains
    UNMEASURED, not REFUSED — no sample has ever been scored against it, so there
    is no gate evidence either way. Corrected status: BLOCKED ON GENERATION THROUGHPUT,
    not blocked on renderer capability. See docs/day12/infinigen_throughput.md for
    the measured per-stage timing, the scenes/hour extrapolation, and the decision
    memo (overnight local vs. rented GPU) this correction is based on.'
