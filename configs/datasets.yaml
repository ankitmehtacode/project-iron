  - name: ShanghaiTech-Campus
    lane: R
    subsystem: anomaly
    hypothesis_class: research-only
  - name: CUHK-Avenue
    lane: R
    subsystem: anomaly
    hypothesis_class: research-only
  - name: UCF-Crime
    lane: R
    subsystem: anomaly
    hypothesis_class: research-only
