  - name: synthetic-indoor-v1
    lane: S
    subsystem: everything
    hypothesis_class: >-
      Ours outright. Every asset is generated by
      scripts/gen_synthetic_indoor.py from geometric primitives; nothing is
      imported, so there is no third-party license in the stack and the SMPL
      trap does not apply. Lane S is not conditional here.
    content_sha: "c1dac6732d18e716..."
    notes: >-
      Analytic indoor scenes with EXACT ground truth (metric depth, 3D agent
      positions, occlusion-flagged tracks, instance segmentation, exact
      intrinsics/extrinsics). NOT photorealistic and NOT Kubric — see the
      dataset manifest for why. SYNTHETIC-ONLY BASELINE: Site Zero footage
      supersedes it for every product claim, and a scorecard from it must not
      be quoted externally.
    asset_clearance:
      - asset: room shell (floor, ceiling, four walls)
        origin: axis-aligned planes generated by this file
        license: ours — no third-party asset
        smpl_derived: "no"
      - asset: furniture (desks, cabinets, partitions)
        origin: axis-aligned boxes generated by this file
        license: ours — no third-party asset
        smpl_derived: "no"
      - asset: agents (torso box, head sphere, two leg cylinders)
        origin: articulated primitives generated by this file
        license: ours — no third-party asset
        smpl_derived: "NO — this is the SMPL trap, avoided by construction. No body model, no scan, no likeness of any person."
      - asset: textures
        origin: seeded procedural noise generated by this file
        license: ours — no third-party asset
        smpl_derived: "no"

  - name: synthetic-indoor-v3
    lane: S
    subsystem: everything
    hypothesis_class: >-
      Ours outright, on the same footing as synthetic-indoor-v1: every asset is
      generated by scripts/gen_synthetic_indoor.py from geometric primitives,
      nothing is imported, and the SMPL trap does not apply. Lane S is not
      conditional here.
    content_sha: "minted by --write-golden; see configs/golden/v3-indoor.golden.json"
    notes: >-
      Re-authored indoor scenes, superseding synthetic-indoor-v1 as the active
      eval set. v1 scored observable_fraction 0.4444 — its agents walked off
      the bottom frame edge because the cameras had yaw-only extrinsics, and a
      partition slab sat on the primary sightline. Cameras here are pitched
      down, paths are held inside a 3.5-11 m band, and furniture occludes from
      the side. Agent speed is a set property rather than an accident: paths
      span roughly 0.04 to 10 gate px/frame, straddling the background
      absorption floor, so the set exercises the measured envelope curve
      instead of one point on it. v1 is NOT deleted — it remains the record of
      what was measured before, and its numbers are not comparable to these.
      SYNTHETIC-ONLY: Site Zero footage supersedes it for every product claim.
    asset_clearance:
      - asset: room shell (floor, ceiling, four walls)
        origin: axis-aligned planes generated by this file
        license: ours — no third-party asset
        smpl_derived: "no"
      - asset: furniture (desks, cabinets, partitions)
        origin: axis-aligned boxes generated by this file
        license: ours — no third-party asset
        smpl_derived: "no"
      - asset: agents (torso box, head sphere, two leg cylinders)
        origin: articulated primitives generated by this file
        license: ours — no third-party asset
        smpl_derived: "NO — this is the SMPL trap, avoided by construction. No body model, no scan, no likeness of any person."
      - asset: textures
        origin: seeded procedural noise generated by this file
        license: ours — no third-party asset
        smpl_derived: "no"

  # -- real depth evaluation (day 10) ------------------------------------
  # Depth is appearance-learned and cannot be scored on anything this project
  # can generate — v2 and v3 both fail the depth validity gate. These are the
  # candidates that can. NONE is fetched; each needs a human to read its terms.
  - name: DA-2K
    lane: R
    subsystem: depth
    hypothesis_class: >-
      Depth-Anything's own relative-depth benchmark. Believed research-only.
      VERIFY before any use beyond local eval.
    notes: >-
      PAIRWISE RELATIVE DEPTH on annotated pixel pairs — which is exactly what
      disparity_rel can be scored on, with NO metric alignment and therefore no
      scale/shift fit to launder a constant prediction into a good number. That
      makes it the single best first real depth eval for this project. Adapter
      implemented and tested against a synthesized 5-pair fixture; ready the
      moment the licence clears. HUMAN ACTION: read the DA-2K terms and record
      a licence snapshot.
  - name: ETH3D
    lane: R
    subsystem: depth
    hypothesis_class: research/non-commercial — verify
    notes: >-
      High-accuracy laser-scanned indoor/outdoor GT. Real materials, real
      lighting, so it can exercise what analytic primitives cannot. HUMAN
      ACTION: verify licence.
  - name: iBims-1
    lane: R
    subsystem: depth
    hypothesis_class: research-only — verify
    notes: >-
      Indoor benchmark built for exactly this failure mode: planarity, depth
      boundaries and directed depth error rather than a single pooled AbsRel.
      Closest public match to the product's domain. HUMAN ACTION: verify licence.
  - name: DIODE-indoor
    lane: R
    subsystem: depth
    hypothesis_class: research-only — verify
    notes: >-
      Dense indoor GT at long range, which is where this project's coverage
      question lives. HUMAN ACTION: verify licence.
  - name: Infinigen-Indoors-depth-candidate
    lane: S
    subsystem: depth
    hypothesis_class: >-
      BSD-3 generator, procedurally generated assets, ours outright once
      generated — same standing as synthetic-indoor-v3.
    notes: >-
      CANDIDATE ONLY, AND NOT TRUSTED FOR DEPTH. Procedural materials and real
      shading may restore the cues analytic primitives delete, or may not.
      ACCEPTANCE PROCEDURE, binding: generate a set, run it through the
      Objective-2 depth validity gate (rank correlation >= 0.30, dynamic range
      >= 3.0, no distance band above 90% of pixels), and only then may a depth
      number be computed on it. The same test condemned v3-indoor. Being
      synthetic-but-photorealistic is a hypothesis, not a pass. HUMAN ACTION:
      none — this one is unblocked by work, not by paperwork.
      DAY 11: default indoors pipeline does NOT generate humans — the human
      assets live in a separate Infinigen branch and are not commercially
      cleared. This entry is therefore silent on human-appearance capabilities.
      DAY 11 GENERATION VERDICT: no scoreable sample was produced on this box.
      Two paths were attempted from a clean .venv-infinigen (Python 3.11.15,
      bpy==4.2.0, infinigen==1.12.2 — Infinigen requires ==3.11.*, so the pinned
      3.10 measurement env stayed untouched; scikit-image was constrained to
      0.21.0 because Infinigen's pinned 0.19.3 cannot build on macOS 15 clang).
      Furnished path (`fast_solve.gin`) ran 623 constraint-annealing iterations
      over 21m35s, completed 7 of many solver stages across 5 rooms, and was
      killed with 0 frames rendered — each annealing iteration takes 25-55s
      and per-stage budgets are 100 iterations. Empty-room path
      (`singleroom.gin + fast_solve.gin + no_objects.gin`) exits in ~30s on
      an `AssertionError: (0.024, 0.018, 1280, 720)` inside
      `get_sensor_coords` — the default sensor is 4:3 and the default render
      resolution is 16:9, and the `--overrides execute_tasks.generate_resolution=[160,120]`
      needed to reconcile them is silently not applied by gin. Full logs
      preserved at docs/day11/infinigen_render_stall.log (furnished path) and
      docs/day11/infinigen_empty_room_stderr.log (empty-room assertion).
      Strategic consequence: no renderer available to us can
      score appearance-learned capabilities in a decision-quality session
      budget on this hardware, which makes real data the sole path for depth,
      semantics and re-ID. This is a finding about *our compute*, not about
      Infinigen's quality: on a GPU box with hours of budget, the acceptance
      procedure remains the right test.
      DAY 12 CORRECTION: the Day-11 verdict above overclaimed. What Day 11
      established is that generation did not COMPLETE within a session
      budget on this hardware — it never established that Infinigen CANNOT
      generate a passing sample. Those are different claims and the first
      does not imply the second. The depth validity gate on this candidate
      remains UNMEASURED, not REFUSED — no sample has ever been scored
      against it, so there is no gate evidence either way. Corrected
      status: BLOCKED ON GENERATION THROUGHPUT, not blocked on renderer
      capability. See docs/day12/infinigen_throughput.md for the measured
      per-stage timing, the scenes/hour extrapolation, and the decision
      memo (overnight local vs. rented GPU) this correction is based on.
    asset_clearance:
      - asset: Infinigen generator (code)
        origin: github.com/princeton-vl/infinigen v1.12.2, pip wheel on PyPI
          (v1.15.5 unavailable to us — its scikit-image==0.19.3 pin does not
          build on macOS 15 clang, and the pip resolver dropped to 1.12.2)
        license: BSD-3-Clause
        smpl_derived: "no"
      - asset: bpy 4.2.0 (Blender Python module)
        origin: PyPI wheel, pinned by Infinigen
        license: GPL-3.0 (Blender). Runs the generator; does not ship in our
          product. Rendered pixel arrays are not GPL-encumbered outputs.
        smpl_derived: "no"
      - asset: room shells, furniture, decor
        origin: procedurally generated by Infinigen from CC0/self-authored
          primitives (see infinigen/assets/objects/)
        license: procedurally generated — no third-party asset in the render
        smpl_derived: "no"
      - asset: materials and textures
        origin: procedural shaders (Blender node graphs authored in Infinigen)
        license: procedurally generated — no third-party asset
        smpl_derived: "no"
      - asset: agents (humans, animals)
        origin: NOT USED — default indoors pipeline places no humans
        license: n/a
        smpl_derived: "n/a — none placed. Human-body assets live in a separate
          branch and are excluded from this sample by construction."

  # -- consented self-collected ------------------------------------------
  - name: site-zero
    lane: C
    subsystem: everything
    hypothesis_class: ours — consent records stored with the data
    notes: >-
      Our office as deployment #1 and dataset #1. The only lane admissible
      for INT8 calibration. Does not exist yet; the capture protocol and
      consent template are in the Day-5 report.

  - name: office-capture-v1
    lane: C
    subsystem: everything
    hypothesis_class: >-
      Ours, consented. Ingested by scripts/ingest_capture.py, which REFUSES
      without a resolvable consent record — lane C is defined by that record,
      and footage without one is not lane C.
    content_sha: "per-clip; see data/captures/office-capture-v1/capture_manifest.json"
    notes: >-
      Office corridor capture at 720p and 1080p. NOT YET INGESTED — the
      footage does not exist in this repository. The ingest path is built and
      tested against a synthesized stand-in; no parity number may be derived
      from that stand-in, and none has been. Frames are decoded once at ingest
      and stored, because OpenCV builds disagree frame-for-frame and a
      re-decoded fixture is not a fixture. Each clip records whether it is
      larger than the 320x180 gate raster: a clip that is not never exercises
      the downscale, which is precisely how the day-2 parity claim came to be
      vacuous.

