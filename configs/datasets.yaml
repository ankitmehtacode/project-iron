    the ScienceDB DOI page and the arXiv paper body are NOT verified by this entry
    — see docs/chirla_verification_checklist.md for the human task that covers them).
    Confirmed from the README at that commit: 22 individuals, 7 multi-view cameras,
    70 video sequences, 596,345 frames, 963,554 bounding-box annotations, 1080x720
    @ 30fps, captured over 7 months at the Robotics, Vision, and Intelligent Systems
