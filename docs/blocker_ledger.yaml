- id: chirla-deployment-scope-legal-review
  description: >-
    configs/datasets.yaml's CHIRLA entry now records a
    deployment_scope_restriction (Day 38, Objective 1): its HuggingFace
    dataset card states, verbatim, "Any deployment aimed at surveillance,
    identification, or monitoring of real people without explicit consent
    or where it violates privacy or law." -- a clause absent from both the
    GitHub README and the published paper. This is independent of
    CHIRLA's license (clean, CC-BY-4.0) and of its subject consent
    (unusually strong, IRB-approved) -- a third axis this registry had no
    field for until today. Two readings exist with materially different
    consequences (narrow: permits use if the DEPLOYED system has its own
    valid consent architecture; broad: excludes any surveillance/
    identification/monitoring product regardless of deployment consent),
    and choosing between them is a legal interpretation this codebase is
    not authorized to make for itself -- see
    src.data.registry.DeploymentScopeRestriction and
    DatasetRegistry.require_product_claim_clearance.
  category: human_decision
  first_recorded:
    sha: 8d6aec6729758f22242aa53875779eafbe0eaa70
    date: 2026-09-08
  unblocks:
    - "Any use of CHIRLA's data beyond internal algorithm benchmarking,
       including any product-facing claim about re-ID performance --
       require_product_claim_clearance refuses silently-passing-through
       use while deployment_scope_restriction.resolved is False."
  estimated_human_effort: >-
    Requires counsel, not a fixed duration -- a legal interpretation
    question, not an engineering estimate.

