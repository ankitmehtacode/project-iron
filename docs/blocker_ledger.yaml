- id: component-cap-carrier-identity-type-change
  description: >-
    resolve_component_membership takes (existing: Component,
    carried_entity_id: str, cap_config: ComponentCapConfig) — nothing
    hypothesis-shaped. resolve_data_association's output
    (AssociationCandidate) cannot drive it automatically because
    AssociationCandidate.proposition is a deliberately opaque string (the
    hypothesis store's own "does not interpret" boundary,
    src/model/hypothesis.py). Wiring the two together needs
    AssociationCandidate extended with a structured carrier concept, which
    also affects the identity-resolution use case (no carrier concept
    there today). Day 33, Objective 3 named this explicitly and declined
    to pick unilaterally: "a real type change affecting the
    identity-resolution use case too ... not decided unilaterally today."
    Day 34's punch list restated it as item 3 and it has not moved since.
  category: human_decision
  first_recorded:
    sha: 4b1c557038b51ac8fcb7c16c78cec4c5e23c4494
    date: 2026-09-07
  unblocks:
