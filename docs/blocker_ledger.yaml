# Blocker Ledger — Day 37, Objective 1.
#
# Every entry here is a HUMAN-GATED blocker: something no amount of further
# engineering in this repository resolves, because the next step is a person
# reading a license, pointing a camera, buying hardware, or making a decision
# this codebase cannot make for itself. See FOUNDATION_REPORT.md's Day-36
# Verdicts for the finding that motivated this file: MEVA's own verification
# was restated as "still pending" 52 separate times across 34 day-sections
# without ever being acted on. That is not a MEVA-specific problem — it is
# what happens to any blocker whose only record is a sentence in a narrative
# report that nobody is structurally required to re-check. This file, plus
# scripts/blocker_report.py and tests/test_blocker_ledger.py, make that
# failure mode impossible to repeat silently: every entry's age is computed
# fresh from git, not carried forward from memory, and Day 37 onward no
# FOUNDATION_REPORT.md section is valid without restating it.
#
# Fields, per entry:
#   id                     — short, stable, kebab-case; referenced by the
#                            report's ## Blockers block and by this ledger's
#                            own structural test.
#   description            — what the blocker actually is, in plain terms.
#   category               — human_verification | human_capture |
#                            human_procurement | human_decision
#   first_recorded         — {sha, date}. COMPUTED via `git log` on the
#                            file/line that first mentions the blocker, e.g.
#                            `git log --follow --diff-filter=A --oneline --
#                            <path>` or `git log -S"<phrase>" --oneline --
#                            <path>`, then `git show -s --format='%H|%ad'
#                            --date=short <sha>`. Never estimated from
#                            memory or from a day number — day numbers in
#                            this project's narrative do not correspond to
#                            calendar days (see FOUNDATION_REPORT.md's own
#                            git-log timestamps: Days 20-36 were all
#                            committed on 2026-09-07). tests/
#                            test_blocker_ledger.py verifies every sha here
#                            actually exists in this repository's history
#                            and that its committed date matches the value
#                            recorded below — an entry that drifts from git
#                            truth fails the suite, it does not sit quietly
#                            wrong.
#   unblocks               — the specific capabilities/objectives gated on
#                            this blocker being resolved by a human.
#   estimated_human_effort — honest, stated, not false-precision.

- id: dataset-license-and-consent-verification
  description: >-
    All 63 datasets registered in configs/datasets.yaml have
    license_snapshot: null (verified directly today: `grep -c
    "license_snapshot:" configs/datasets.yaml` returns 0 — the key never
    appears with a value, only ever as the pydantic field's implicit null
    default) — zero have ever had a human read, hash, and record the
    license text that would let the registry admit them past lane R
    (eval/model-selection only). MEVA specifically has had this restated
    as "still pending" 52 times across 34 FOUNDATION_REPORT.md
    day-sections (Day 36, Objective 1) without a human ever opening the
    license page it names. CHIRLA (Day 36) is the one entry with a
    genuinely fast path: docs/chirla_verification_checklist.md is a
    stated five-minute, four-item checklist, not a research assignment.
  category: human_verification
  first_recorded:
    sha: bf85e758686d6a73add76ef558702bd96417da31
    date: 2026-07-31
  unblocks:
    - "A real FrozenBackbone implementation (src/identity/) — currently a
       Protocol with no concrete binding; the bake-off that would choose
       one needs at least one verified lane-R or lane-C dataset to run
       against."
    - "The backbone bake-off harness (src/identity/bakeoff.py, Day 36
       Objective 4) — built, self-tested, never run against real data."
    - "The identity adapter trainer's promotion gate — self-tested only
       against a synthetic Gaussian-cluster gallery; never exercised on a
       real distribution of embeddings."
    - "Clothing-change robustness specifically has no candidate dataset in
       this registry besides CHIRLA (lane R, eval-only)."
  estimated_human_effort: >-
    CHIRLA: five minutes (docs/chirla_verification_checklist.md, four
    checkboxes). MEVA and the remaining ~61 entries: unknown per-entry,
    plausibly minutes-to-hours each depending on how each license is
    published; nobody has attempted even one, so no real estimate exists
    yet — reported as unknown rather than guessed.

