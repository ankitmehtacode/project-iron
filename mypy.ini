; Type-checking scope for project-iron.
;
; --strict is applied to the packages written or rewritten during the
; foundation work. It is deliberately NOT applied to the legacy modules
; (src/geometry, src/graph, src/interface, src/models, src/semantics,
; src/utils, src/integration.py, src/orchestrator.py, src/memory_manager.py,
; src/rag_agent.py, src/vector_database.py).
;
; That is not an aspiration to tighten "later". Turning --strict on across the
; whole tree today would produce several hundred errors in one pass, and a
; check that is failing everywhere gets ignored everywhere — at which point it
; stops catching the new bugs it was added to catch. Legacy strictness lands
; module-by-module: each module moves into the strict list in the same change
; that adds its annotations, so the boundary only ever moves forward and CI
; stays green throughout.
;
; The strict set is what CI enforces:
;   src/config.py src/provenance.py src/contracts src/endurance src/events
;   src/cascade

[mypy]
files = src/config.py, src/provenance.py, src/contracts, src/endurance, src/events, src/cascade, src/data, src/semantics/patch_mapping.py

; python_version is deliberately NOT pinned here. Pinning it to the repo floor
; (3.10) makes mypy parse installed stub files under 3.10 rules, and current
; numpy stubs use PEP 695 `type X = ...` syntax, which is a 3.12 construct —
; so the pin fails on numpy itself before reaching any of our code.
;
; Instead mypy analyses against whichever interpreter it runs on, and the CI
; `types` job pins that interpreter to 3.10. The floor is therefore still
; checked, in CI, which is the authority. A developer on 3.12 gets 3.12
; semantics locally and CI catches anything that only holds there.

; Follow imports into legacy modules for name resolution, but do not report
; their errors. Without this, importing a legacy module from a strict one would
; surface the legacy module's problems as failures of the strict one.
follow_imports = silent

strict = True
warn_unused_configs = True
show_error_codes = True
pretty = True

; Third-party packages without bundled type information that the strict set
; actually imports. Stubs are installed where they exist (types-psutil,
; types-PyYAML, scipy-stubs); these ship none at all. Only modules genuinely
; reached are listed — warn_unused_configs is on, so a section for something
; no longer imported is reported rather than left to rot.
[mypy-cv2.*]
ignore_missing_imports = True

[mypy-pyarrow.*]
ignore_missing_imports = True

[mypy-openvino.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-cotracker.*]
ignore_missing_imports = True





